<form class="card" [formGroup]="form" (ngSubmit)="submit()">
  <h2>{{ title() }}</h2>

  <div class="form-grid">
    <label>
      Color
      <select formControlName="color">
        @for (c of colors; track c) {
          <option [value]="c">{{ c }}</option>
        }
      </select>
    </label>

    <label>
      Size
      <select formControlName="size">
        @for (s of sizes; track s) {
          <option [value]="s">{{ s }}</option>
        }
      </select>
    </label>

    <label>
      Price (USD)
      <input type="number" step="0.01" min="0.01" formControlName="price" />
    </label>

    <label>
      Quantity
      <input type="number" step="1" formControlName="quantity" />
    </label>
  </div>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <div class="actions">
    <button class="primary" type="submit" [disabled]="form.invalid || saving()">
      {{ isEdit() ? 'Save' : 'Add' }}
    </button>
    <button type="button" (click)="cancelled.emit()">Cancel</button>
  </div>
</form>
